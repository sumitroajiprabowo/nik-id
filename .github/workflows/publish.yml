name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/validate.js
          test -f dist/validate.cjs
          test -f dist/validate.d.ts
          test -f dist/parse.js
          test -f dist/parse.cjs
          test -f dist/parse.d.ts
          test -f dist/generate.js
          test -f dist/generate.cjs
          test -f dist/generate.d.ts
          test -f dist/types.d.ts
          echo "All expected dist files exist"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
